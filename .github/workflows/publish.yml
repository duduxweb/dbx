name: Build and publish playlists

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out DBX
        uses: actions/checkout@v4

      - name: Build full and category playlists
        run: python3 scripts/merge_playlists.py

      - name: Publish or replace stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="playlist-latest"
          assets=(public/playlist.m3u public/categories-index.json public/categories/*.m3u)
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "DBX playlists" \
              --notes "Generated full playlist, category playlists, and category index from Ramys/Iptv-Brasil-2026." \
              --repo "$GH_REPO"
          fi
